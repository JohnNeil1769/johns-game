<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'><title>John's Game V5</title><style>*{box-sizing:border-box}body{margin:0;background:#17231b;font-family:system-ui;color:white;overflow:hidden}#wrap{height:100dvh;display:flex;flex-direction:column}#hud{height:46px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;background:#17231b;font-weight:700;font-size:14px}canvas{display:block;width:100%;flex:1;min-height:0;background:#9edbfa;touch-action:none}.controls{height:112px;display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:12px;padding:10px 14px max(14px,env(safe-area-inset-bottom));background:#17231b}.controls button{border:0;border-radius:18px;font-size:20px;font-weight:900;background:#f3f0df;color:#17231b;touch-action:none}.overlay{position:fixed;inset:0;background:#17231bee;display:flex;align-items:center;justify-content:center;padding:20px}.card{max-width:560px;width:100%;background:#f5f0df;color:#18251b;border-radius:22px;padding:20px;text-align:center}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.choice{padding:15px;border:3px solid transparent;border-radius:14px;background:white;font-weight:800}.choice.sel{border-color:#317b42}input{width:100%;padding:12px;border-radius:10px;border:1px solid #aaa;font-size:17px;margin:5px 0 10px}.start{width:100%;padding:14px;border:0;border-radius:12px;background:#317b42;color:white;font-size:18px;font-weight:900}</style></head><body><div id='wrap'><div id='hud'><span id='names'>Hero vs Boss</span><span id='lives'>❤️❤️❤️</span><span id='mission'>Find the detective's house</span></div><canvas id='g' width='1000' height='500'></canvas><div class='controls'><button id='L'>◀ LEFT</button><button id='R'>RIGHT ▶</button><button id='J'>⬆ JUMP</button></div></div><div class='overlay' id='setup'><div class='card'><h1>John's Game — Version 5 🇦🇺</h1><p>Choose your hero and enemy, then enter the Australian jungle.</p><b>Hero</b><div class='row'><button class='choice hero sel' data-n='0'>Hero 1</button><button class='choice hero' data-n='1'>Hero 2</button></div><input id='hn' value='Explorer' placeholder='Hero name'><b>Enemy</b><div class='row'><button class='choice enemy sel' data-n='0'>Enemy 1</button><button class='choice enemy' data-n='1'>Enemy 2</button></div><input id='en' value='The Boss' placeholder='Enemy name'><button class='start' id='start'>START LEVEL 1</button></div></div><script>
const c=document.getElementById('g'),x=c.getContext('2d'),S=document.getElementById('setup');let hv=0,ev=0,hero='Explorer',enemy='The Boss',keys={},p,lives,ghost,body,potion,cam,knives,frame,inv,fileTaken=false,msg='',nextKnife=70,pickupFlash=0;const G=390,W=3200,logs=[590,930,1260],river=[1540,2010],crocs=[1610,1740,1870,1970],shop=1100,house=2920;
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{let cl=b.classList.contains('hero')?'hero':'enemy';document.querySelectorAll('.'+cl).forEach(q=>q.classList.remove('sel'));b.classList.add('sel');if(cl==='hero')hv=+b.dataset.n;else ev=+b.dataset.n});
function hud(){names.textContent=hero+' vs '+enemy;livesEl.textContent=ghost?'👻 GHOST':'❤️'.repeat(lives)+'♡'.repeat(3-lives);mission.textContent=ghost?(potion?'Return to your body':'Find chemist + jump for potion'):'Find the detective’s hidden house'}const livesEl=document.getElementById('lives'),names=document.getElementById('names'),mission=document.getElementById('mission');
function reset(){p={x:100,y:G-52,w:34,h:52,vx:0,vy:0};lives=3;ghost=false;body=null;potion=false;cam=0;knives=[];frame=0;inv=0;fileTaken=false;nextKnife=45+Math.floor(Math.random()*75);pickupFlash=0;msg='Three lives. Time your jumps: knives can catch you above the logs!';hud()}
const startBtn=document.getElementById('start'),hnInput=document.getElementById('hn'),enInput=document.getElementById('en');startBtn.addEventListener('click',()=>{hero=hnInput.value.trim()||'Hero';enemy=enInput.value.trim()||'Enemy';S.style.display='none';reset();});
function hit(){if(ghost||inv)return;lives--;inv=90;if(lives){p.x=Math.max(50,p.x-100);p.y=G-p.h;p.vy=0;msg='Hit! '+lives+' lives left.'}else{ghost=true;body={x:p.x};potion=false;msg='You are a ghost — find the chemist!'}hud()}
function logRect(q){return{x:q,y:G-42,w:112,h:42}}function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function tree(a,b,s){x.save();x.translate(a,b);x.scale(s,s);x.fillStyle='#624329';x.beginPath();x.moveTo(-12,0);x.lineTo(-17,-135);x.lineTo(16,-135);x.lineTo(11,0);x.fill();x.fillStyle='#326b38';[[-30,-140,43],[30,-145,45],[0,-178,48],[-5,-115,40]].forEach(z=>{x.beginPath();x.arc(...z,0,Math.PI*2);x.fill()});x.restore()}
function drawLog(q){x.fillStyle='#704625';x.beginPath();if(x.roundRect){x.roundRect(q,G-42,112,42,18)}else{x.rect(q,G-42,112,42)}x.fill();x.strokeStyle='#3c2818';x.lineWidth=4;x.stroke();x.fillStyle='#bd8650';x.beginPath();x.ellipse(q+107,G-21,12,18,0,0,Math.PI*2);x.fill();x.strokeStyle='#6e4828';x.lineWidth=2;x.beginPath();x.arc(q+107,G-21,7,0,Math.PI*2);x.stroke();for(let i=0;i<3;i++){x.fillStyle='#3f6c31';x.fillRect(q+20+i*25,G-48,7,10)}}
function croc(q){x.fillStyle='#466d38';x.beginPath();x.ellipse(q,G+1,56,15,0,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(q+40,G-9);x.lineTo(q+78,G);x.lineTo(q+40,G+10);x.fill();x.fillStyle='#111';x.beginPath();x.arc(q+32,G-7,3,0,Math.PI*2);x.fill();x.fillStyle='white';for(let i=0;i<5;i++){x.beginPath();x.moveTo(q+48+i*6,G-3);x.lineTo(q+52+i*6,G+1);x.lineTo(q+48+i*6,G+4);x.fill()}}
function draw(){x.clearRect(0,0,c.width,c.height);let gr=x.createLinearGradient(0,0,0,500);gr.addColorStop(0,'#94d9fb');gr.addColorStop(1,'#d7efac');x.fillStyle=gr;x.fillRect(0,0,1000,500);x.save();x.translate(-cam,0);for(let i=0;i<W;i+=180)tree(i+30,G,.7+(i%500)/2500);x.fillStyle='#527b38';x.fillRect(0,G,W,110);logs.forEach(drawLog);x.fillStyle='#2587bb';x.fillRect(river[0],G,river[1]-river[0],110);crocs.forEach(croc);x.fillStyle='#eee1c8';x.fillRect(shop-65,G-130,130,130);x.fillStyle='#b63333';x.fillRect(shop-65,G-130,130,30);x.fillStyle='white';x.font='bold 15px system-ui';x.fillText('CHEMIST',shop-39,G-110);x.fillStyle='#77502f';x.fillRect(shop+20,G-78,38,7);x.fillStyle='#64ca77';x.fillRect(shop+33,G-103,13,25);x.fillStyle='#453327';x.fillRect(house,G-140,170,140);x.fillStyle='#704a32';x.beginPath();x.moveTo(house-20,G-140);x.lineTo(house+85,G-210);x.lineTo(house+190,G-140);x.fill();x.fillStyle='#f1dfae';x.fillText('DETECTIVE HOUSE',house+18,G-80);x.fillStyle='#8b5a34';x.fillRect(house+38,G-72,94,7);if(!fileTaken){x.fillStyle='#f3e7b3';x.fillRect(house+72,G-108,34,30);x.strokeStyle='#333';x.strokeRect(house+72,G-108,34,30);x.fillStyle='#222';x.font='bold 10px system-ui';x.fillText('FILE',house+78,G-89)}knives.forEach(k=>{x.fillStyle='#d9d9d9';x.beginPath();x.moveTo(k.x,k.y);x.lineTo(k.x+42,k.y+6);x.lineTo(k.x,k.y+12);x.fill();x.fillStyle='#5b3a24';x.fillRect(k.x+38,k.y+1,17,10)});if(body){x.globalAlpha=.5;x.fillStyle='#aa3e38';x.fillRect(body.x,G-50,34,50);x.globalAlpha=1}if(ghost){x.globalAlpha=.72;x.fillStyle='white';x.beginPath();x.arc(p.x+17,p.y+18,19,0,Math.PI*2);x.fill();x.fillRect(p.x,p.y+18,34,29);x.globalAlpha=1}else{x.globalAlpha=inv&&Math.floor(inv/7)%2?.35:1;x.fillStyle=hv?'#3563b7':'#a83d38';x.fillRect(p.x,p.y+17,34,35);x.fillStyle='#d0a07b';x.beginPath();x.arc(p.x+17,p.y+12,13,0,Math.PI*2);x.fill();x.globalAlpha=1}if(ghost&&potion){x.fillStyle='#65d47a';x.fillRect(p.x+28,p.y+24,10,19);x.fillStyle='#e8fff0';x.fillRect(p.x+30,p.y+20,6,5)}if(!ghost&&fileTaken){x.fillStyle='#f3e7b3';x.fillRect(p.x+27,p.y+25,22,17);x.strokeStyle='#333';x.strokeRect(p.x+27,p.y+25,22,17);x.fillStyle='#222';x.font='bold 7px system-ui';x.fillText('FILE',p.x+29,p.y+36)}x.restore();x.fillStyle='#15251bcc';x.fillRect(12,12,520,35);x.fillStyle='white';x.font='bold 16px system-ui';x.fillText(msg,24,35);if(pickupFlash){x.fillStyle='rgba(255,255,255,.92)';x.fillRect(330,75,340,60);x.fillStyle='#17351f';x.font='bold 25px system-ui';x.textAlign='center';x.fillText(potion&&ghost?'🧪 POTION COLLECTED!':'📁 FILE COLLECTED!',500,113);x.textAlign='start'}}
function tick(){frame++;if(inv)inv--;if(pickupFlash)pickupFlash--;let old=p.x;p.vx=(keys.R?5.5:0)-(keys.L?5.5:0);p.x=Math.max(0,Math.min(W-40,p.x+p.vx));if(!ghost){for(const q of logs){let r=logRect(q);if(ov(p,r)){if(p.vx>0)p.x=q-p.w;else if(p.vx<0)p.x=q+r.w;msg='The log blocks the path — JUMP over it!'}}}if(keys.J){if(ghost){p.vy=-5}else if(p.y>=G-p.h-1)p.vy=-13;keys.J=false}p.vy+=ghost?.16:.7;p.vy=Math.min(p.vy,ghost?4:14);p.y+=p.vy;if(p.y>G-p.h){p.y=G-p.h;p.vy=0}if(ghost)p.y=Math.max(90,p.y);if(!ghost&&p.x>350&&p.x<W-300){nextKnife--;if(nextKnife<=0){knives.push({x:p.x+760,y:270+Math.random()*25,w:55,h:12});nextKnife=75+Math.floor(Math.random()*105)}}knives.forEach(k=>k.x-=5);knives=knives.filter(k=>k.x>p.x-850);if(!ghost)knives.forEach(k=>{if(ov(p,k))hit()});if(!ghost&&p.x>river[0]&&p.x<river[1]&&p.y>=G-p.h-2&&!crocs.some(q=>Math.abs(p.x-q)<50))hit();if(ghost&&!potion&&Math.abs(p.x-shop)<80&&p.y<G-75){potion=true;pickupFlash=45;msg='🧪 POTION COLLECTED! Now return to your body.';hud()}else if(ghost&&!potion&&Math.abs(p.x-shop)<95)msg='The potion is on the shelf — JUMP!';if(ghost&&potion&&body&&Math.abs(p.x-body.x)<45){ghost=false;lives=3;potion=false;p.x=body.x;p.y=G-p.h;body=null;inv=110;msg='REVIVED! All three lives restored.';hud()}if(!ghost&&!fileTaken&&p.x>house-20&&p.x<house+175){if(p.y<G-72){fileTaken=true;pickupFlash=45;msg='📁 FILE COLLECTED! You found the enemy clues — LEVEL 1 COMPLETE!'}else{msg='The detective’s file is on the shelf — JUMP to get it!'}}cam=Math.max(0,Math.min(W-1000,p.x-260));draw();requestAnimationFrame(tick)}
function bind(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();keys[k]=false}}bind('L','L');bind('R','R');bind('J','J');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.L=1;if(e.key==='ArrowRight')keys.R=1;if(e.key==='ArrowUp'||e.key===' ')keys.J=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.L=0;if(e.key==='ArrowRight')keys.R=0});reset();requestAnimationFrame(tick);
</script></body></html>
